# Override for M6, on top of the second lab copy:
#   COMPOSE_FILE=docker-compose.m3.yml:docker-compose.m6.yml
# Three aioquic servers on the server network, one per release. Memory capped at 1 GB so
# a flood that makes the server grow is killed by the kernel instead of the host.
x-aioq: &aioq
  cap_add: [NET_ADMIN]
  mem_limit: 1g
  volumes: ["./certs:/certs:ro"]
services:
  aq100:
    <<: *aioq
    build: { context: ./aioq, args: { AIOQUIC_VERSION: "1.0.0" } }
    networks: { servernet: { ipv4_address: 10.20.2.20 } }
  aq120:
    <<: *aioq
    build: { context: ./aioq, args: { AIOQUIC_VERSION: "1.2.0" } }
    networks: { servernet: { ipv4_address: 10.20.2.21 } }
  aq180:
    <<: *aioq
    build: { context: ./aioq, args: { AIOQUIC_VERSION: "1.8.0" } }
    networks: { servernet: { ipv4_address: 10.20.2.22 } }
