# M4 configuration: nginx.conf plus 0-RTT and a debug log (used by docker-compose.m4.yml)
worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    sendfile      on;

    # one line per request: protocol, timing and the QUIC/TLS details we need later
    log_format lab '$time_iso8601 $remote_addr:$remote_port "$request" $status '
                   '$body_bytes_sent rt=$request_time proto=$server_protocol '
                   'h3=$http3 tls=$ssl_protocol cipher=$ssl_cipher reused=$ssl_session_reused '
                   'early=$ssl_early_data';
    access_log /var/log/nginx/access.log lab;
    error_log  /var/log/nginx/error.log info;
    # debug log (nginx-debug binary) to follow path validation and 0-RTT
    error_log  /var/log/nginx/debug.log debug;

    server {
        # same port, TCP for HTTP/2 and UDP for HTTP/3
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        http3 on;
        # default is 64k, which caps one HTTP/3 stream at 64 KB per RTT (≈10 Mbit/s at 50 ms).
        # 4m covers the bandwidth-delay product of the lab (50 Mbit/s × 200 ms ≈ 1.25 MB).
        # m2-buffer.sh measures the default against this value.
        http3_stream_buffer_size 4m;
        server_name server.lab;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.3;

        # M4: 0-RTT on (off in the M1-M3 configuration)
        ssl_early_data on;
        # one key for Retry/NEW_TOKEN tokens shared by all workers; without it a worker that is
        # still shutting down after a reload cannot decrypt tokens issued by the new worker
        quic_host_key /certs/quic_host.key;
        # extra directives written by the M4 scripts (e.g. quic_retry on), empty by default
        include /etc/nginx/m4-extra/*.conf;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        root /srv/www;
    }
}
