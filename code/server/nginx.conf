worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    sendfile      on;

    # one line per request: protocol, timing and the QUIC/TLS details we need later
    log_format lab '$time_iso8601 $remote_addr:$remote_port "$request" $status '
                   '$body_bytes_sent rt=$request_time proto=$server_protocol '
                   'h3=$http3 tls=$ssl_protocol cipher=$ssl_cipher reused=$ssl_session_reused '
                   'early=$ssl_early_data';
    access_log /var/log/nginx/access.log lab;
    error_log  /var/log/nginx/error.log info;

    server {
        # same port, TCP for HTTP/2 and UDP for HTTP/3
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        http3 on;
        server_name server.lab;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.3;

        # 0-RTT is off by default; M4 turns it on explicitly
        ssl_early_data off;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        root /srv/www;
    }
}
